[project]
name = "SEJ2025-icesheets"
version = "0.1.0"
description = "A module within FACTS2 that produces sea-level change projections from 2000-2300 by sampling from the structured-expert judgement ice sheet projections of Kopp et al. (in review)."
readme = "README.md"
authors = [
    { name = "Elizabeth H. Davis",
    email = "elizabeth.h.davis@rutgers.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
SEJ2025-icesheets = "2025SEJ-icesheets.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"
